<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip preview</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html, body { margin: 0; height: 100%; background: #14161b; color: #eef0f5; }
      body { display: flex; flex-direction: column; }
      .stage { flex: 1; display: grid; place-items: center; padding: 16px; overflow: auto;
        background: repeating-conic-gradient(#1b1e25 0% 25%, #171a20 0% 50%) 50% / 20px 20px; }
      img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
      footer { padding: 10px 16px; font-size: 12px; color: #9aa1b2; border-top: 1px solid #2d3240; }
    </style>
  </head>
  <body>
    <div class="stage"><img id="shot" alt="Latest snip" /></div>
    <footer id="info">Waiting for a snip…</footer>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
