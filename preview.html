<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip preview</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --accent: #6c8cff; --line: #2d3240; --muted: #9aa1b2; --card: #1d2027; }
      html, body { margin: 0; height: 100%; background: #14161b; color: #eef0f5; }
      body { display: flex; flex-direction: column; }
      .stage { flex: 0 0 22%; display: grid; place-items: center; padding: 10px; overflow: auto;
        background: repeating-conic-gradient(#1b1e25 0% 25%, #171a20 0% 50%) 50% / 20px 20px; }
      img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 6px 24px rgba(0,0,0,.5); }

      .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line); background: #181b21; }
      button { font: inherit; font-size: 14px; color: inherit; background: var(--card); border: 1px solid var(--line);
        border-radius: 9px; padding: 6px 12px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.play { background: var(--accent); border-color: var(--accent); color: #fff; width: 44px; font-size: 16px; }
      button:disabled { opacity: .4; cursor: default; }
      .speeds { margin-left: auto; display: flex; gap: 4px; }
      .speeds button { padding: 5px 8px; font-size: 12px; }
      .speeds button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

      #text { flex: 1; margin: 0; padding: 14px 18px; overflow: auto; white-space: pre-wrap; font-size: 17px; line-height: 1.7;
        user-select: text; -webkit-user-select: text; }
      #text.muted { color: var(--muted); }
      #text.error { color: #ff6b6b; }
      .w { cursor: pointer; border-radius: 4px; padding: 1px 0; }
      .w:hover { background: rgba(108, 140, 255, .18); }
      .w.now { background: var(--accent); color: #fff; }
      footer { padding: 7px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <div class="stage"><img id="shot" alt="Latest snip" /></div>
    <div class="bar">
      <button id="play" class="play" type="button" title="Play / Pause" disabled>▶</button>
      <button id="stop" type="button" title="Stop" disabled>⏹</button>
      <div class="speeds" id="speeds">
        <button type="button" data-s="0.75">0.75×</button>
        <button type="button" data-s="1" class="on">1×</button>
        <button type="button" data-s="1.25">1.25×</button>
        <button type="button" data-s="1.5">1.5×</button>
        <button type="button" data-s="2">2×</button>
      </div>
    </div>
    <div id="text" class="muted">Waiting for a snip…</div>
    <footer id="info">Click any word to start reading from there.</footer>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
