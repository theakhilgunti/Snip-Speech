<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnipSpeech overlay</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; -webkit-user-select: none; }
      #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38); pointer-events: none; }
      #sel {
        position: fixed; display: none; pointer-events: none;
        border: 1px solid #fff; box-sizing: border-box;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.38); /* dims everything outside the box */
      }
      #size {
        position: fixed; display: none; pointer-events: none;
        font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff; background: rgba(20, 22, 27, 0.85); padding: 3px 7px; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <img id="bg" alt="" />
    <div id="dim"></div>
    <div id="sel"></div>
    <div id="size"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
